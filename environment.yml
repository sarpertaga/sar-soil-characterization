name: soilgeo
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - gdal>=3.8
  - rasterio>=1.3
  - rioxarray>=0.15
  - xarray>=2024.1
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - scipy>=1.12
  - scikit-learn>=1.4
  - matplotlib>=3.8
  - jupyter
  - ipykernel
  - pytest>=8
  - ruff>=0.4
  - pip
  - pip:
      - sentinelhub>=3.10
      - python-dotenv>=1.0
      - whitebox>=2.3
      - pyyaml>=6.0
