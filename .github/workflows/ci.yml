name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install rasterio rioxarray xarray geopandas shapely pyproj scipy \
                      scikit-learn matplotlib sentinelhub python-dotenv whitebox \
                      pyyaml pytest ruff

      - name: Install package
        run: pip install -e .

      - name: Lint
        run: ruff check src/ tests/ pipelines/

      - name: Unit tests
        run: pytest tests/unit/ -v -m "not integration"
